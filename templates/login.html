{% extends "base.html" %}
{% block title %}Login - XShip{% endblock %}
{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-shipping-fast"></i>
            <h1>Welcome to XShip</h1>
            <p>Courier & Delivery Management System</p>
        </div>
        <form method="POST" class="login-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-primary full-width">Login</button>
        </form>
        <div class="demo-links">
            <p><strong>🔑 Demo Accounts:</strong></p>
            <div class="demo-user">
                <strong>👑 Admin:</strong> admin@xship.com / <code>admin123</code>
            </div>
            <div class="demo-user">
                <strong>🚚 Staff:</strong> staff@xship.com / <code>staff456</code>
            </div>
            <div class="demo-user">
                <strong>👤 Client:</strong> client@xship.com / <code>client789</code>
            </div>
        </div>
    </div>
</div>
{% endblock %}
